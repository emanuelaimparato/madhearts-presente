<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>MadHearts — Presente</title>
<link rel="icon" href="assets/icona.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  @font-face { font-family: "League Gothic"; src: url("assets/fonts/LeagueGothic.ttf"); }
  @font-face { font-family: "DM Sans"; src: url("assets/fonts/DMSans.ttf"); }
  :root { --red: #F5383C; --red-dim: #8a1f22; --pink: #FF8485; --ink: #EDEDED; --muted: #9a9a9a; --line: rgba(255,255,255,.12);
          --glass: rgba(16,16,16,.78); --card: #111; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas#gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body.hide-cursor, body.hide-cursor * { cursor: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
  .gothic { font-family: "League Gothic", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .03em; font-weight: 400; }
  .btn { font-family: "League Gothic", "Arial Narrow", sans-serif; text-transform: uppercase; letter-spacing: .04em; font-size: 22px; padding: 10px 20px;
         border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: #fff; transition: background .2s, border-color .2s; }
  .btn:hover { background: rgba(255,255,255,.12); }
  .btn.primary { background: var(--red); border-color: var(--red); }
  .btn.primary:hover { background: #ff4d51; }
  .btn.danger { color: var(--pink); border-color: var(--red-dim); background: transparent; }
  .btn.small { font-size: 18px; padding: 7px 14px; }

  /* ---------- schermata di avvio */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; background: #000; z-index: 20; padding: 16px; text-align: center; }
  #start img { width: min(230px, 50vw); }
  #start h1 { font-size: clamp(40px, 7vw, 64px); margin: -6px 0 0; }
  #start .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  #start .btn { font-size: 28px; padding: 14px 32px; }
  #start .btn.primary { font-size: 34px; padding: 14px 48px; }
  #start p { color: var(--muted); font-size: 14px; margin: 0; max-width: 520px; line-height: 1.6; }
  .err { color: var(--pink); }

  /* ---------- icone in alto a destra */
  #hud { position: fixed; top: 18px; right: 18px; z-index: 10; display: flex; gap: 10px; opacity: 0; transform: translateY(-8px); transition: opacity .35s, transform .35s; pointer-events: none; }
  #hud.show { opacity: 1; transform: none; pointer-events: auto; }
  .icon { width: 52px; height: 52px; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); display: grid; place-items: center; color: #fff;
          backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: background .2s, transform .2s; }
  .icon:hover { background: rgba(40,40,40,.9); transform: scale(1.05); }
  .icon svg { width: 24px; height: 24px; }

  /* ---------- sovrapposizioni (pausa, impostazioni) */
  .overlay { position: fixed; inset: 0; z-index: 12; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.55);
             backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .sheet { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; width: min(440px, 100%); padding: 26px 26px 22px;
           box-shadow: 0 30px 80px rgba(0,0,0,.6); transform: translateY(12px) scale(.98); transition: transform .3s; max-height: calc(100vh - 32px); overflow: auto; }
  .overlay.open .sheet { transform: none; }

  #pause .sheet { text-align: center; }
  #pause img { width: 74px; }
  #pause h2 { font-size: 44px; margin: 6px 0 2px; }
  #pause .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  #pause .btn.primary { width: 100%; font-size: 30px; padding: 12px; }
  .vols { text-align: left; margin: 18px 0 8px; }
  .toggles { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
  .link { color: var(--muted); font-size: 14px; margin-top: 16px; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: #fff; }

  /* cursori */
  .slider { margin: 12px 0; }
  .slider label { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; margin-bottom: 4px; }
  .slider label b { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }
  .slider .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--red) var(--p, 50%), rgba(255,255,255,.18) var(--p, 50%)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #fff; margin-top: -8px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255,255,255,.18); }
  input[type=range]::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--red); }
  input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border: none; border-radius: 50%; background: #fff; }

  /* interruttore */
  .switch { display: inline-flex; align-items: center; gap: 10px; font-size: 15px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  .switch i { width: 38px; height: 22px; border-radius: 11px; background: rgba(255,255,255,.2); position: relative; transition: background .2s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .switch.on i { background: var(--red); }
  .switch.on i::after { transform: translateX(16px); }

  /* impostazioni */
  #settings .sheet { width: min(760px, 100%); height: min(620px, calc(100vh - 32px)); display: grid; grid-template-columns: 190px 1fr; grid-template-rows: auto 1fr; padding: 0; overflow: hidden; }
  #settings header { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 14px 24px; border-bottom: 1px solid var(--line); }
  #settings header h2 { font-size: 34px; margin: 0; }
  #settings nav { border-right: 1px solid var(--line); padding: 12px 10px; overflow: auto; }
  #settings nav button { display: block; width: 100%; text-align: left; padding: 10px 14px; border-radius: 10px; font-size: 15px; color: var(--muted); }
  #settings nav button:hover { color: #fff; background: rgba(255,255,255,.05); }
  #settings nav button.on { color: #fff; background: rgba(245,56,60,.16); box-shadow: inset 3px 0 0 var(--red); }
  #settings .pane { padding: 18px 24px 24px; overflow: auto; }
  #settings .pane h3 { font-size: 26px; margin: 0 0 4px; }
  #settings .pane p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 10px; }
  .close { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .close:hover { color: #fff; background: rgba(255,255,255,.08); }
  .kv { font-size: 14px; line-height: 1.9; }
  .kv b { color: #fff; font-weight: 500; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .qrbox { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 14px 0; }
  .qrbox img { width: 170px; height: 170px; background: #fff; padding: 8px; border-radius: 12px; image-rendering: pixelated; }
  .pin { font-family: "League Gothic", sans-serif; font-size: 56px; letter-spacing: .12em; color: #fff; line-height: 1; }
  .url { font-size: 12px; color: var(--muted); word-break: break-all; }
  kbd { font-family: inherit; font-size: 12px; padding: 1px 7px; border-radius: 6px; border: 1px solid var(--line); background: rgba(255,255,255,.06); }
  @media (max-width: 640px) {
    #settings .sheet { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: calc(100vh - 32px); }
    #settings nav { border-right: none; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding: 8px; }
    #settings nav button { white-space: nowrap; width: auto; }
  }

  /* debug e avvisi */
  #debug { position: fixed; left: 16px; top: 16px; z-index: 9; width: min(520px, 45vw); background: rgba(18,18,18,.92); border-radius: 12px; overflow: hidden; display: none; font-size: 13px; }
  #debug canvas { width: 100%; display: block; }
  #debug .lines { padding: 8px 10px; line-height: 1.55; font-variant-numeric: tabular-nums; white-space: pre-wrap; }
  #debug .msg { color: var(--muted); }
  #toast { position: fixed; top: 22px; left: 50%; transform: translate(-50%, -10px); z-index: 30; background: var(--glass); border: 1px solid var(--line); border-radius: 12px;
           padding: 9px 16px; font-size: 14px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; backdrop-filter: blur(8px); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<!-- avvio -->
<div id="start">
  <img src="assets/logo.png" alt="MadHearts">
  <h1 class="gothic">Presente</h1>
  <div class="row">
    <button class="btn primary" id="go-camera">Avvia</button>
    <button class="btn" id="go-demo">Prova senza camera</button>
  </div>
  <p id="hint">Consenti l'accesso alla webcam quando il browser lo chiede: le immagini restano su questo dispositivo e non vengono mai salvate.</p>
</div>

<!-- icone in alto a destra -->
<div id="hud">
  <button class="icon" id="h-pause" aria-label="Pausa" title="Pausa (Spazio)"></button>
  <button class="icon" id="h-settings" aria-label="Impostazioni" title="Impostazioni">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div>

<!-- menu di pausa -->
<div class="overlay" id="pause" role="dialog" aria-label="Pausa">
  <div class="sheet">
    <img src="assets/logo.png" alt="">
    <h2 class="gothic">In pausa</h2>
    <p class="sub">La camera è spenta.</p>
    <button class="btn primary" id="p-resume">Riprendi</button>
    <div class="vols" id="p-vols"></div>
    <div class="toggles">
      <button class="switch" id="p-mute"><i></i>Muto</button>
      <button class="switch" id="p-full"><i></i>Schermo intero</button>
    </div>
    <button class="link" id="p-settings">Impostazioni avanzate</button>
  </div>
</div>

<!-- impostazioni -->
<div class="overlay" id="settings" role="dialog" aria-label="Impostazioni">
  <div class="sheet">
    <header><h2 class="gothic">Impostazioni</h2><button class="close" id="s-close" aria-label="Chiudi">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <nav id="s-nav"></nav>
    <div class="pane" id="s-pane"></div>
  </div>
</div>

<div id="debug"><canvas id="dbgcam" width="560" height="315"></canvas><div class="lines" id="dbglines"></div></div>
<div id="toast"></div>

<script type="module">
import { DEFAULTS, deepMerge } from "./js/config.js";
import { Camera } from "./js/camera.js";
import { Tracker, SIDES } from "./js/tracking.js";
import { MotionProcessor } from "./js/motion.js";
import { SimulatedVisitor } from "./js/simulate.js";
import { createContext } from "./js/visuals/gl.js";
import { VisualEngine } from "./js/visuals/engine.js";
import { Attract } from "./js/visuals/attract.js";
import { Audio } from "./js/audio.js";
import { PARAMS, PARAM, USER_PARAMS, TECH_GROUPS, loadSettings, saveSettings, clearSettings, toConfig, clampParam, formatParam } from "./js/settings.js";
import { RemoteHost } from "./js/remote-host.js";
import qrcode from "./vendor/qrcode/qrcode.mjs";

const $ = (id) => document.getElementById(id);
const canvas = $("gl");
const SPHERE_KEY = "madhearts.sfera.v1";
// indirizzo pubblico dell'app (per il codice QR del telefono quando la si usa da "localhost")
const PUBLIC_URL = "";
const BASE = deepMerge(DEFAULTS, { app: { max_dpr: 1.5 } });
let overrides = loadSettings();
let cfg = deepMerge(BASE, toConfig(overrides));
const app = { playing: false, debug: false, source: null, cam: null, tracker: null, sim: null, motion: null, state: null, obs: null,
              messages: [], clearArmed: 0, ringCount: 0, ringsAtStart: 0, fps: 0, t0: 0, camStarting: false, tab: "Esperienza" };

const ICON_PAUSE = `<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>`;
const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>`;

// ---------------------------------------------------------------- grafica e audio
let gl, engine, attract;
const audio = new Audio(cfg, say);
try { gl = createContext(canvas); } catch (e) { $("hint").innerHTML = `<span class="err">${e.message}</span>`; }
function screenSize() {
  const dpr = Math.min(window.devicePixelRatio || 1, cfg.app.max_dpr);
  return [Math.round(innerWidth * dpr), Math.round(innerHeight * dpr)];
}
function resize() {
  const [w, h] = screenSize();
  canvas.width = w; canvas.height = h;
  engine?.resize([w, h]);
  attract?.configure(cfg, [w, h]);
}
if (gl) {
  engine = new VisualEngine(gl, screenSize(), cfg);
  attract = new Attract(gl, engine.quad);
  resize();
  loadSphere();
  addEventListener("resize", resize);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- telecomando dal telefono
const remote = new RemoteHost({ onCommand: (m) => command(m), onChange: () => app.tab === "Telefono" && renderPane() });
function remoteBase() {
  const local = ["localhost", "127.0.0.1"].includes(location.hostname);
  if (!local) return location.href.replace(/[^/]*([?#].*)?$/, "");
  return PUBLIC_URL;
}

// ---------------------------------------------------------------- regolazioni
function applyConfig() {
  cfg = deepMerge(BASE, toConfig(overrides));
  engine?.configure(cfg);
  app.motion?.configure(cfg);
  audio.configure(cfg);
  attract?.configure(cfg, [canvas.width, canvas.height]);
  syncControls();
}
function value(id) {
  const [sec, key] = id.split(".");
  const v = cfg[sec]?.[key];
  if (v !== undefined) return v;
  const defaults = { visuals: engine?.p, attract: attract?.p, audio: audio.v, motion: app.motion?.p ?? {} };
  return defaults[sec]?.[key] ?? 0;
}
function setParam(id, v, announce = false) {
  if (!PARAM[id]) return;
  overrides[id] = clampParam(id, v);
  saveSettings(overrides);
  applyConfig();
  if (announce) toast(`${PARAM[id][1]}: ${formatParam(id, overrides[id])}`);
}

// ---------------------------------------------------------------- sfera salvata nel browser
function loadSphere() {
  try {
    const raw = localStorage.getItem(SPHERE_KEY);
    if (raw) { engine.sphere.load(JSON.parse(raw), engine.t, Date.now() / 1000); say(`sfera ripristinata: ${engine.sphere.rings.length} anelli`); }
  } catch (e) { say("sfera salvata non leggibile: riparte da un anello"); }
  engine.sphere.ensureInitial(engine.p.initial_rings, engine.t);
  app.ringCount = engine.sphere.count;
  app.ringsAtStart = engine.sphere.rings.length;
}
function saveSphere() {
  try { localStorage.setItem(SPHERE_KEY, JSON.stringify(engine.sphere.export(engine.t, Date.now() / 1000))); }
  catch (e) { say("ERRORE: impossibile salvare la sfera in questo browser"); }
}
function clearSphere() {
  engine.sphere.clear(engine.t, engine.p.initial_rings);
  app.ringCount = engine.sphere.count;
  app.ringsAtStart = engine.sphere.rings.length;
  saveSphere();
  toast("sfera azzerata");
}
addEventListener("pagehide", () => engine && saveSphere());

function say(text) {
  app.messages.push([performance.now(), text]);
  app.messages = app.messages.slice(-8);
  console.log("[MadHearts]", text);
}
let toastTimer = 0;
function toast(text) {
  say(text);
  $("toast").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("toast").classList.remove("show"), 1800);
}

// ---------------------------------------------------------------- camera: si spegne in pausa
async function cameraOn() {
  if (app.cam || app.camStarting) return true;
  app.camStarting = true;
  try {
    app.cam = await new Camera(cfg.camera).start();
    if (!app.tracker) app.tracker = await Tracker.create(cfg, ".");
    say(`camera ${app.cam.settings.width}x${app.cam.settings.height} · elaborazione ${app.tracker.delegate}`);
    return true;
  } catch (e) {
    app.cam?.stop(); app.cam = null;
    toast(e.message);
    return false;
  } finally {
    app.camStarting = false;
  }
}
function cameraOff() { app.cam?.stop(); app.cam = null; app.obs = null; }

async function setPlaying(on) {
  if (on === app.playing) return;
  if (on && app.source === "camera" && !(await cameraOn())) return;
  if (!on && app.source === "camera") cameraOff();
  app.playing = on;
  $("pause").classList.toggle("open", !on && !$("settings").classList.contains("open"));
  syncControls();
  showHud();
}

// ---------------------------------------------------------------- comandi (schermo, tastiera, telefono)
function command(m) {
  if (m.cmd === "play") setPlaying(true);
  else if (m.cmd === "pause") setPlaying(false);
  else if (m.cmd === "mute") { audio.setMuted(m.value ?? !audio.muted); syncControls(); }
  else if (m.cmd === "set") setParam(m.id, m.value);
}

// ---------------------------------------------------------------- avvio
async function start(source) {
  $("hint").textContent = source === "camera" ? "Avvio della webcam e del riconoscimento…" : "Avvio della simulazione…";
  await audio.start();                                   // l'audio può partire solo dopo un clic
  app.source = source;
  app.motion = new MotionProcessor(cfg);
  if (source === "camera") {
    if (!(await cameraOn())) { $("hint").innerHTML = `<span class="err">${app.messages.at(-1)?.[1] ?? "Webcam non disponibile"}</span>`; app.source = null; return; }
  } else {
    app.sim = new SimulatedVisitor({ restFor: 8 });
    say("simulazione");
  }
  app.t0 = performance.now();
  app.playing = true;
  $("start").style.display = "none";
  attract.fadeToBlack(false);
  buildUserSliders();
  syncControls();
  showHud();
  if (remote.wanted) remote.enable();
}
$("go-camera").onclick = () => start("camera");
$("go-demo").onclick = () => start("demo");

// ---------------------------------------------------------------- ciclo
let last = performance.now(), lastSim = 0, frames = 0, fpsT = last, lastSlow = 0;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (app.source === "camera" && app.cam && app.tracker && app.cam.newFrame()) {
    app.obs = app.tracker.process(app.cam.video, app.cam.frameId);
    if (app.playing) app.state = app.motion.update(app.obs);
  } else if (app.source === "demo" && app.playing) {
    const t = (now - app.t0) / 1000;
    if (t - lastSim >= 1 / 30) { lastSim = t; app.obs = app.sim.observe(t); app.state = app.motion.update(app.obs); }
  }
  if (!app.playing) app.state = null;
  const st = app.state;
  if (st) for (const e of st.events) if (e.kind === "complete") say(`filo completato (${e.data.reason}, ${e.data.strokes} gesti)`);
  engine.update(st, dt);
  audio.update(st, dt, app.playing);
  if (st) st.events = [];
  if (engine.sphere.count !== app.ringCount) {
    app.ringCount = engine.sphere.count;
    saveSphere();
    audio.chime(app.ringCount);
    say(`nuovo anello — la sfera ne ha ${engine.sphere.rings.length}`);
  }
  attract.update(dt, app.playing, st ? st.personPresence : 0);
  engine.render(dt, [canvas.width, canvas.height]);
  attract.draw();
  if (app.debug) drawDebug();
  frames++;
  if (now - fpsT > 1000) { app.fps = (frames * 1000) / (now - fpsT); frames = 0; fpsT = now; }
  if (now - lastSlow > 500) {
    lastSlow = now;
    if (app.tab === "Sistema" && $("settings").classList.contains("open")) renderPane();
    remote.broadcast(snapshot());
  }
  requestAnimationFrame(frame);
}

function snapshot() {
  const st = app.state;
  return { playing: app.playing, muted: audio.muted, rings: engine.sphere.rings.length, person: !!(st && st.personPresence > 0.5),
           session: !!(st && st.sessionActive), camera: app.source === "demo" ? "simulazione" : app.cam ? "accesa" : "spenta",
           params: Object.fromEntries(PARAMS.map((p) => [p[0], value(p[0])])) };
}

// ---------------------------------------------------------------- icone in alto a destra
let hudTimer = 0;
function showHud() {
  if (!app.source) return;
  $("hud").classList.add("show");
  document.body.classList.remove("hide-cursor");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(() => {
    if ($("hud").matches(":hover") || document.querySelector(".overlay.open")) return showHud();
    $("hud").classList.remove("show");
    document.body.classList.add("hide-cursor");
  }, 3000);
}
addEventListener("mousemove", showHud);
addEventListener("touchstart", showHud, { passive: true });

function toggleFull() { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => toast("schermo intero non disponibile")); }
function openSettings(open = true) {
  $("settings").classList.toggle("open", open);
  if (open) { $("pause").classList.remove("open"); renderNav(); renderPane(); }
  else if (!app.playing) $("pause").classList.add("open");
  showHud();
}

$("h-pause").onclick = () => setPlaying(!app.playing);
$("h-settings").onclick = () => openSettings(!$("settings").classList.contains("open"));
$("p-resume").onclick = () => setPlaying(true);
$("p-mute").onclick = () => command({ cmd: "mute" });
$("p-full").onclick = toggleFull;
$("p-settings").onclick = () => openSettings(true);
$("s-close").onclick = () => openSettings(false);
$("settings").addEventListener("click", (e) => { if (e.target.id === "settings") openSettings(false); });
document.addEventListener("fullscreenchange", syncControls);

// ---------------------------------------------------------------- cursori
function sliderEl(id) {
  const [, label, , lo, hi, step, , hint] = PARAM[id];
  const el = document.createElement("div");
  el.className = "slider"; el.dataset.id = id;
  el.innerHTML = `<label><span>${label}</span><b></b></label><input type="range" min="${lo}" max="${hi}" step="${step}">${hint ? `<div class="hint">${hint}</div>` : ""}`;
  const input = el.querySelector("input");
  input.addEventListener("input", () => { el.dataset.busy = Date.now(); setParam(id, +input.value); paintSlider(el); });
  paintSlider(el);
  return el;
}
function paintSlider(el) {
  const id = el.dataset.id, input = el.querySelector("input"), [, , , lo, hi] = PARAM[id];
  if (document.activeElement !== input && Date.now() - (+el.dataset.busy || 0) > 1200) input.value = value(id);
  el.querySelector("b").textContent = formatParam(id, +input.value);
  input.style.setProperty("--p", `${((input.value - lo) / (hi - lo)) * 100}%`);
}
function buildUserSliders() {
  const box = $("p-vols");
  if (!box.childElementCount) for (const p of USER_PARAMS) box.appendChild(sliderEl(p[0]));
}
function syncControls() {
  $("h-pause").innerHTML = app.playing ? ICON_PAUSE : ICON_PLAY;
  $("h-pause").title = app.playing ? "Pausa (Spazio)" : "Riprendi (Spazio)";
  $("p-mute").classList.toggle("on", audio.muted);
  $("p-full").classList.toggle("on", !!document.fullscreenElement);
  document.querySelectorAll(".slider").forEach(paintSlider);
}

// ---------------------------------------------------------------- impostazioni (schede)
const TABS = [...TECH_GROUPS, "Telefono", "Sistema"];
function renderNav() {
  $("s-nav").innerHTML = "";
  for (const t of TABS) {
    const b = document.createElement("button");
    b.textContent = t; b.className = t === app.tab ? "on" : "";
    b.onclick = () => { app.tab = t; renderNav(); renderPane(); };
    $("s-nav").appendChild(b);
  }
}
const INTRO = {
  Esperienza: "Come la luce risponde ai gesti.",
  Rilevamento: "Quanto la camera è sensibile e quando un filo conta come completato.",
  Sfera: "La struttura collettiva sullo sfondo.",
  Audio: "I singoli suoni. Volume, musica ed effetti si regolano anche dal menu di pausa.",
  Attesa: "Cosa vede il pubblico quando nessuno sta intrecciando.",
};
function renderPane() {
  const pane = $("s-pane"), t = app.tab;
  if (TECH_GROUPS.includes(t)) {
    pane.innerHTML = `<h3 class="gothic">${t}</h3><p>${INTRO[t] || ""} Le modifiche si salvano da sole.</p>`;
    for (const p of PARAMS.filter((q) => q[2] === t)) pane.appendChild(sliderEl(p[0]));
    return;
  }
  if (t === "Telefono") return renderPhone(pane);
  // Sistema
  const st = app.state;
  const cam = app.source === "demo" ? "simulazione" : app.cam ? `accesa · ${app.cam.settings.width}x${app.cam.settings.height} · ${app.cam.fps().toFixed(0)} fps` : "spenta (pausa)";
  pane.innerHTML = `<h3 class="gothic">Sistema</h3>
    <div class="kv">Stato: <b>${app.playing ? "esperienza attiva" : "in pausa"}</b><br>Camera: <b>${cam}</b><br>
    Persona: <b>${st && st.personPresence > 0.5 ? "presente" : "nessuno"}</b> · intreccio <b>${st && st.sessionActive ? "in corso" : "in attesa"}</b><br>
    Grafica: <b>${app.fps.toFixed(0)} fps</b><br>
    Audio: <b>${audio.ok ? (audio.muted ? "silenziato" : "attivo") : "non disponibile"}</b> · musica <b>${audio.musicName || "nessuna (web/audio/musica.mp3)"}</b><br>
    Sfera: <b>${engine.sphere.rings.length} anelli</b> · da questo avvio <b>${engine.sphere.rings.length - app.ringsAtStart}</b></div>
    <div class="actions">
      <button class="btn small" id="x-debug">${app.debug ? "Nascondi debug" : "Mostra debug"}</button>
      <button class="btn small" id="x-reset">Valori iniziali</button>
      <button class="btn small danger" id="x-clear">Azzera la sfera</button>
    </div>
    <p style="margin-top:18px">Tasti: <kbd>Spazio</kbd> pausa · <kbd>F</kbd> schermo intero · <kbd>+</kbd> <kbd>−</kbd> volume · <kbd>M</kbd> muto · <kbd>D</kbd> debug · <kbd>Esc</kbd> chiude</p>`;
  $("x-debug").onclick = () => { toggleDebug(); renderPane(); };
  $("x-reset").onclick = () => { if (confirm("Tornare ai valori iniziali? Le regolazioni salvate verranno dimenticate.")) { overrides = {}; clearSettings(); applyConfig(); toast("valori iniziali"); } };
  $("x-clear").onclick = () => { if (confirm("Azzerare la sfera? Resterà un solo anello.")) { clearSphere(); renderPane(); } };
}

function renderPhone(pane) {
  const base = remoteBase(), on = !!remote.peer;
  let body = `<h3 class="gothic">Telefono</h3>
    <p>Usa il telefono come telecomando: pausa, volumi e impostazioni. Il collegamento è diretto tra telefono e computer
    (serve Internet solo per trovarsi; non viene inviata nessuna immagine).</p>
    <button class="switch ${on ? "on" : ""}" id="x-remote"><i></i>Telecomando ${on ? "attivo" : "spento"}</button>`;
  if (on) {
    body += `<div class="kv" style="margin-top:12px">Stato: <b>${remote.status}</b> · telefoni collegati: <b>${remote.conns.size}</b></div>`;
    if (base) {
      const url = remote.remoteUrl(base);
      const qr = qrcode(0, "M"); qr.addData(url); qr.make();
      body += `<div class="qrbox"><img alt="Codice QR del telecomando" src="${qr.createDataURL(6, 2)}">
        <div><div style="font-size:13px;color:var(--muted)">PIN</div><div class="pin">${remote.pin}</div>
        <button class="btn small" id="x-pin" style="margin-top:10px">Nuovo PIN</button></div></div>
        <p>Inquadra il codice con la fotocamera del telefono, apri il link e inserisci il PIN.</p><div class="url">${url}</div>`;
    } else {
      body += `<p style="margin-top:12px">Per collegare il telefono apri l'app dal suo indirizzo online (Netlify) invece che da questo computer: il telefono non può aprire "localhost".</p>`;
    }
  }
  pane.innerHTML = body;
  $("x-remote").onclick = () => { remote.peer ? remote.disable() : remote.enable(); renderPane(); };
  $("x-pin") && ($("x-pin").onclick = () => { remote.newPin(); renderPane(); });
}

// ---------------------------------------------------------------- debug
const dbg = $("dbgcam").getContext("2d");
function toggleDebug() { app.debug = !app.debug; $("debug").style.display = app.debug ? "block" : "none"; }
function drawDebug() {
  const W = 560, H = 315, obs = app.obs, st = app.state, minVis = cfg.tracking.min_visibility;
  dbg.fillStyle = "#111"; dbg.fillRect(0, 0, W, H);
  if (app.cam) { dbg.save(); if (cfg.camera.mirror) { dbg.translate(W, 0); dbg.scale(-1, 1); } dbg.drawImage(app.cam.video, 0, 0, W, H); dbg.restore(); }
  else { dbg.fillStyle = "#777"; dbg.font = "15px DM Sans"; dbg.fillText(app.source === "demo" ? "simulazione" : "camera spenta", 220, 160); }
  const v = engine.p, z = v.input_zoom;
  dbg.strokeStyle = "#f53c3c"; dbg.lineWidth = 1;
  dbg.strokeRect((v.input_center_x - 0.5 / z) * W, (v.input_center_y - 0.5 / z) * H, W / z, H / z);
  const COL = { left: "#ff50dc", right: "#3cdcff" };
  if (obs && obs.present) for (const s of SIDES) {
    const a = obs.arms[s], ch = [a.shoulder, a.elbow, a.wrist];
    dbg.strokeStyle = dbg.fillStyle = COL[s]; dbg.lineWidth = 2;
    for (let i = 0; i < 2; i++) if (Math.min(ch[i].visibility, ch[i + 1].visibility) >= minVis) { dbg.beginPath(); dbg.moveTo(ch[i].x * W, ch[i].y * H); dbg.lineTo(ch[i + 1].x * W, ch[i + 1].y * H); dbg.stroke(); }
    for (const p of ch) { dbg.beginPath(); dbg.arc(p.x * W, p.y * H, 4, 0, 7); p.visibility >= minVis ? dbg.fill() : dbg.stroke(); }
  }
  if (st) for (const s of SIDES) { const a = st.arms[s]; if (a.presence > 0.05) { dbg.strokeStyle = "#fff"; dbg.beginPath(); dbg.arc(a.pos[0] * W, a.pos[1] * H, 8, 0, 7); dbg.stroke(); } }
  const lines = [`${app.playing ? "ATTIVA" : "IN PAUSA"} · grafica ${app.fps.toFixed(0)} fps · anelli ${engine.sphere.rings.length}` +
    (app.cam ? ` · camera ${app.cam.fps().toFixed(0)} fps · ${obs ? obs.poseMs.toFixed(1) : "–"} ms` : "")];
  if (st) lines.push(`intreccio ${st.sessionActive ? "IN CORSO" : "in attesa"} · riposo ${st.restTime.toFixed(1)} s · assente ${st.absentTime.toFixed(1)} s`);
  const t = performance.now();
  for (const [tm, m] of app.messages) if (t - tm < 8000) lines.push(`<span class="msg">${m}</span>`);
  $("dbglines").innerHTML = lines.join("\n");
}

// ---------------------------------------------------------------- tasti
addEventListener("keydown", (ev) => {
  if (!app.source || ev.target.tagName === "INPUT") return;
  const k = ev.key.toLowerCase();
  if (k === " ") { ev.preventDefault(); setPlaying(!app.playing); }
  else if (k === "f") toggleFull();
  else if (k === "+" || k === "=") setParam("audio.master_volume", value("audio.master_volume") + 0.05, true);
  else if (k === "-") setParam("audio.master_volume", value("audio.master_volume") - 0.05, true);
  else if (k === "m") { command({ cmd: "mute" }); toast(audio.muted ? "audio silenziato" : "audio attivo"); }
  else if (k === "d") toggleDebug();
  else if (k === "escape") openSettings(false);
  else if (k === "c") {
    const t = performance.now();
    if (t - app.clearArmed < 2000) { app.clearArmed = 0; clearSphere(); }
    else { app.clearArmed = t; toast("premi di nuovo C entro 2 s per azzerare la sfera"); }
  }
});

// ---------------------------------------------------------------- funzionamento offline
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

window.__mh = { app, get engine() { return engine; }, audio, remote, start, setPlaying, setParam, command, openSettings };
</script>
</body>
